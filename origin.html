<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020309">
  <title>原点星球 · W.H.Y.号</title>
  <link rel="stylesheet" href="./origin.css?v=20260725-origin-world">
</head>
<body>
  <main class="origin-world" id="origin-world">
    <canvas id="cabin-stars" aria-hidden="true"></canvas>
    <div class="deep-space" aria-hidden="true"></div>

    <header class="world-header">
      <a class="back-link" href="./index.html">← 返回私人星图</a>
      <p>W.H.Y.号 · 正在靠近原点星球</p>
      <span>坐标 00° 00′</span>
    </header>

    <section class="glass-window" aria-label="透过舷窗观察原点星球">
      <div class="glass-edge" aria-hidden="true"></div>
      <div class="glass-glow" aria-hidden="true"></div>
      <div class="glass-reflection reflection-one" aria-hidden="true"></div>
      <div class="glass-reflection reflection-two" aria-hidden="true"></div>

      <div class="planet memory-planet" aria-hidden="true"><i></i></div>
      <div class="planet interest-planet" aria-hidden="true"><i></i></div>
      <div class="planet origin-planet" aria-label="原点星球"><i></i></div>
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>
      <span class="world-coordinate">ORIGIN PLANET / 2,184 KM</span>
    </section>

    <section class="world-copy" aria-live="polite">
      <p class="eyebrow">01 / ORIGIN PLANET</p>
      <h1>此刻的<br><em>辉怡</em></h1>
      <article class="record-text active" data-panel="now">
        <p>在地球上研究水与土地，<br>也在自己的宇宙里寻找坐标。</p>
      </article>
      <article class="record-text" data-panel="belief">
        <p>方向由自己决定；<br>也认真照看与世界相遇时的自己。</p>
      </article>
      <article class="record-text" data-panel="signal">
        <p>走向未知，也珍惜那些<br>会让人认真靠近的情感。</p>
      </article>
    </section>

    <nav class="record-selector" aria-label="原点星球导航">
      <p>探索原点星球</p>
      <button class="record active" data-record="now" type="button"><b>01</b><span>此刻状态<small>现在的我</small></span><i>↗</i></button>
      <button class="record" data-record="belief" type="button"><b>02</b><span>航行准则<small>如何前行</small></span><i>↗</i></button>
      <button class="record" data-record="signal" type="button"><b>03</b><span>私人信号<small>喜欢与在意</small></span><i>↗</i></button>
    </nav>

    <footer class="world-footer">
      <span><i></i> 观测窗开启</span>
      <span>原点星球 / 私人航线</span>
      <button id="quiet-mode" type="button">减弱动态</button>
    </footer>
  </main>
  <script src="./origin.js?v=20260725-origin-world"></script>
</body>
</html>
