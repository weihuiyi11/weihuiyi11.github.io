<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09030f">
  <meta name="description" content="原点星球，W.H.Y.号私人星图中的航行员观测记录。">
  <link rel="canonical" href="https://weihuiyi11.github.io/origin.html">
  <title>原点星球 · W.H.Y.号</title>
  <link rel="stylesheet" href="./origin.css?v=20260731-orbital-motion-1">
</head>
<body>
  <main class="origin-world" id="origin-world">
    <canvas id="origin-dust" aria-hidden="true"></canvas>
    <div class="nebula nebula-one" aria-hidden="true"></div>
    <div class="nebula nebula-two" aria-hidden="true"></div>

    <header class="world-header">
      <button class="back-link" id="back-to-map" type="button">← 返回宇宙星图</button>
      <p>W.H.Y.号 / 原点星球观测记录</p>
      <span>坐标 00° 00′</span>
    </header>

    <section class="planet-stage" id="planet-stage" aria-label="可探索的原点星球">
      <div class="planet-aura" aria-hidden="true"></div>
      <div class="planet-shadow" aria-hidden="true"></div>
      <div class="origin-planet" id="origin-planet" aria-hidden="true">
        <div class="planet-core"></div>
        <div class="planet-crust crust-one"></div><div class="planet-crust crust-two"></div>
        <div class="lava-stream stream-one"></div><div class="lava-stream stream-two"></div><div class="lava-stream stream-three"></div>
        <div class="crystal-field"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="planet-shine"></div><div class="planet-night"></div>
      </div>
      <div class="orbital-path path-one" aria-hidden="true"></div><div class="orbital-path path-two" aria-hidden="true"></div>

      <button class="signal-shard shard-now active" data-record="now" type="button" aria-label="探索此刻状态"><i></i><span><b>01</b> 此刻状态</span></button>
      <button class="signal-shard shard-belief" data-record="belief" type="button" aria-label="探索航行准则"><i></i><span><b>02</b> 航行准则</span></button>
      <button class="signal-shard shard-signal" data-record="signal" type="button" aria-label="探索私人信号"><i></i><span><b>03</b> 私人信号</span></button>
    </section>

    <section class="planet-record" aria-live="polite">
      <p class="record-kicker">ORIGIN CORE / <span id="record-index">01</span></p>
      <article class="record-text active" data-panel="now"><h1>此刻的<br><em>辉怡</em></h1><p>在地球上研究水与土地，<br>也在自己的宇宙里寻找坐标。</p></article>
      <article class="record-text" data-panel="belief"><h1>方向，<br><em>由自己决定</em></h1><p>认真照看与世界相遇时的自己，<br>但不让无关的目光替我决定方向。</p></article>
      <article class="record-text" data-panel="signal"><h1>仍会为<br><em>真挚靠近</em>发亮</h1><p>喜欢未知，也珍惜那些<br>让人愿意认真回应的情感。</p></article>
    </section>

    <div class="interaction-hint" id="interaction-hint"><i></i> 移动光标，感受星球的回应</div>
    <footer class="world-footer"><span><i></i> 原点星球已苏醒</span><span>点击漂浮晶体，读取一段信号</span><button id="quiet-mode" type="button" aria-pressed="false">减弱动态</button></footer>
  </main>
  <script src="./origin.js?v=20260731-srcdoc-return-1" defer></script>
</body>
</html>
